name: iOS Release (TestFlight)

# Builds the signed Arb Scanner IPA on macOS and uploads it to TestFlight.
# Adapted from MusicColab/.github/workflows/ios-release.yml. Secrets (set by tools/github_setup.py):
#   BUILD_CERTIFICATE_BASE64    - Apple Distribution cert + key (.p12, base64) — shared shnr cert in C:\Dev\.Apple\
#   P12_PASSWORD                - password for the .p12
#   PROVISIONING_PROFILE_BASE64 - "Arb Scanner App Store" provisioning profile (base64)
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_API_KEY_P8 - App Store Connect API key

on:
  workflow_dispatch:
    inputs:
      display_version:
        description: "Marketing version (blank = value in csproj)"
        required: false
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/ios-release.yml"]

env:
  PROJECT: app/ArbScanner/ArbScanner.csproj
  CODESIGN_KEY: "Apple Distribution: Shiloh Shaner (V3X94XMM36)"
  CODESIGN_PROVISION: "Arb Scanner App Store"

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  build-and-upload:
    # The user's MacBook (self-hosted runner, label shnr-mac; setup in C:\Dev\MacBook).
    runs-on: [self-hosted, macOS, ARM64, shnr-mac]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # One runner per repo on the same Mac: this Mac-wide lock keeps iOS builds from
      # different repos from overlapping (they share the keychain search list and Xcode).
      - name: Wait for the Mac's iOS build lock
        run: ~/ci/ios-lock.sh acquire

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The newest iOS workload can require an Xcode newer than the Mac's (iOS SDK 27.0 needs Xcode 27).
      # Use the latest workload with Xcode 27+ selected; otherwise pin the workloads to the Xcode 26 line.
      - name: Install MAUI workload for the selected Xcode
        run: |
          XC_MAJOR=$(xcodebuild -version | head -1 | awk '{print int($2)}')
          if [ "$XC_MAJOR" -ge 27 ]; then
            echo "Using $(xcodebuild -version | head -1)"
            dotnet workload install maui
          else
            echo "$(xcodebuild -version | head -1) is older than 27; pinning iOS workload to 26.x"
            cat > rollback.json <<'EOF'
          {
            "microsoft.net.sdk.ios": "26.5.10301/10.0.100",
            "microsoft.net.sdk.maccatalyst": "26.5.10301/10.0.100",
            "microsoft.net.sdk.android": "36.1.69/10.0.100",
            "microsoft.net.sdk.maui": "10.0.20/10.0.100"
          }
          EOF
            dotnet workload install maui --from-rollback-file rollback.json
          fi
          dotnet workload list

      - name: Unit tests (teaching content and explanation math)
        run: dotnet test app/ArbScanner.Core.Tests/ArbScanner.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Import signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          WWDR_PATH="$RUNNER_TEMP/AppleWWDRCAG3.cer"
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          curl -fsSL -o "$WWDR_PATH" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$WWDR_PATH" -t cert -k "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: Build signed IPA
        run: |
          VERSION_ARGS="-p:ApplicationVersion=${{ github.run_number }}"
          [ -n "${{ inputs.display_version }}" ] && VERSION_ARGS="$VERSION_ARGS -p:ApplicationDisplayVersion=${{ inputs.display_version }}"
          dotnet publish "$PROJECT" -f net10.0-ios -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:ValidateXcodeVersion=false \
            -p:CodesignKey="$CODESIGN_KEY" \
            -p:CodesignProvision="$CODESIGN_PROVISION" \
            $VERSION_ARGS

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          IPA=$(find app/ArbScanner/bin/Release/net10.0-ios -name '*.ipa' | head -1)
          echo "Uploading: $IPA"
          mkdir -p ./private_keys
          echo "$ASC_API_KEY_P8" > "./private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Attach IPA to run
        uses: actions/upload-artifact@v4
        with:
          name: ArbScanner-ios
          path: app/ArbScanner/bin/Release/net10.0-ios/**/*.ipa

      # The Mac persists between jobs (hosted runners didn't): delete the signing keychain,
      # profiles and API key, and release the build lock.
      - name: Clean up signing material and release lock
        if: always()
        run: ~/ci/ios-cleanup.sh
